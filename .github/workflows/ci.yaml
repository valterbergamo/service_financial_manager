name: deploy

# main -> /server/prd/services/service_financial_manager (API do https://valterbergamo.com.br/apps/financas/)
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-service-financial
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Deploy na VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          ARGS: "-rlgoDzvO --delete --exclude-from=.gitignore --exclude-from=.dockerignore"
          SOURCE: "./"
          TARGET: "/server/prd/services/service_financial_manager"
          SCRIPT_AFTER_REQUIRED: true
          SCRIPT_AFTER: |
            cd /server/prd/services/service_financial_manager
            docker compose up -d --build --remove-orphans
            docker compose ps --format '{{.Name}}\t{{.Status}}'
