# API do gerenciador financeiro (SAP CAP), só produção.
# Na web: https://valterbergamo.com.br/apps/financas/api/ (o nginx protege com o login do portal).
# Banco: postgres_prd, base "financial". A senha fica no .env do servidor (CDS_REQUIRES_DB_CREDENTIALS_PASSWORD).
name: service_financial_manager
services:
  api:
    build: .
    container_name: financial-api
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - CDS_REQUIRES_DB_CREDENTIALS_HOST=postgres_prd
      - CDS_REQUIRES_DB_CREDENTIALS_PORT=5432
      - CDS_REQUIRES_DB_CREDENTIALS_DATABASE=financial
    ports:
      - "127.0.0.1:6070:4004"
    restart: unless-stopped
    networks:
      - pg-network

networks:
  pg-network:
    external: true
